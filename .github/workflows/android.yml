name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # A failing test is reported but does not stop the build, so there is always an APK to try.
      - name: Tests
        run: flutter test
        continue-on-error: true

      # The signing key lives in repository secrets; the same key on every build is what lets a new
      # APK update the installed app in place instead of asking you to uninstall it first.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No signing key in secrets; the APK will be debug-signed"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # The build number goes up with every run, so each APK counts as an update of the last.
      - name: Build the APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --build-number=${{ github.run_number }}

      - name: Check the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -v "^WARNING" | head -12
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:|sdkVersion|targetSdkVersion|uses-permission: name='android.permission.(INTERNET|FOREGROUND_SERVICE_MEDIA_PLAYBACK|POST_NOTIFICATIONS)'|native-code"

      - name: Name and checksum
        working-directory: .
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk PodSync-android.apk
          sha256sum PodSync-android.apk > PodSync-android.apk.sha256
          ls -la PodSync-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PodSync-android-apk
          path: |
            PodSync-android.apk
            PodSync-android.apk.sha256
