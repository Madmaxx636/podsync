name: Linux build

on:
  push:
    paths-ignore:
      - 'app/android/**'
      - 'app/lib/core/audio_handler.dart'
      - 'app/lib/core/widget_bridge.dart'
      - '.github/workflows/android.yml'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # apt on the runners sometimes hangs on a slow mirror, so: a time limit and retries.
      - name: Install build tools
        timeout-minutes: 12
        working-directory: .
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # IPv6 to the package mirrors is what usually hangs; force IPv4 and give up on slow connections.
          APT="-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            # SIGKILL on the whole thing: a plain timeout leaves apt's download helper hung on the mirror.
            sudo timeout -s KILL 120 apt-get update $APT && \
            sudo timeout -s KILL 300 apt-get install -y $APT clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libasound2-dev libayatana-appindicator3-dev libnotify-dev && break
            echo "apt attempt $attempt failed, retrying"
            sudo pkill -9 -f 'apt-get|/usr/lib/apt/methods' || true
            sudo rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
            sleep 10
          done
          dpkg -s libgtk-3-dev libmpv-dev libayatana-appindicator3-dev libnotify-dev >/dev/null

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        working-directory: .
        run: |
          ./tools/package-linux.sh PodSync-linux-x64.tar.gz
          sha256sum PodSync-linux-x64.tar.gz > PodSync-linux-x64.tar.gz.sha256
          ls -la PodSync-linux-x64.tar.gz
          ./tools/package-deb.sh PodSync-linux-x64.deb
          sha256sum PodSync-linux-x64.deb > PodSync-linux-x64.deb.sha256
          dpkg-deb --info PodSync-linux-x64.deb

      # Prove the archive installs: unpack, run the install script into a scratch home, check the files.
      - name: Test the install script
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/home"
          tar -xzf PodSync-linux-x64.tar.gz -C "$RUNNER_TEMP/unpack"
          HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/data" "$RUNNER_TEMP/unpack/podsync/install.sh"
          test -x "$RUNNER_TEMP/home/data/podsync/podsync"
          grep -q "Exec=$RUNNER_TEMP/home/data/podsync/podsync" "$RUNNER_TEMP/home/data/applications/podsync.desktop"
          ldd "$RUNNER_TEMP/home/data/podsync/podsync" | grep "not found" || echo "all libraries resolved"

      # Prove the .deb installs: apt resolves its libraries, then the program must find them all.
      - name: Test the .deb
        working-directory: .
        run: |
          sudo apt-get install -y ./PodSync-linux-x64.deb
          test -x /usr/bin/podsync
          test -f /usr/share/applications/podsync.desktop
          ldd /opt/podsync/podsync | grep "not found" && exit 1 || echo "all libraries resolved"
          sudo apt-get remove -y podsync
          test ! -e /opt/podsync/podsync

      - uses: actions/upload-artifact@v4
        with:
          name: PodSync-linux
          path: |
            PodSync-linux-x64.tar.gz
            PodSync-linux-x64.tar.gz.sha256
            PodSync-linux-x64.deb
            PodSync-linux-x64.deb.sha256
