name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

      # A failing test is reported but does not stop the build, so there is always a zip to try.
      - name: Tests
        run: flutter test
        continue-on-error: true

      - run: flutter build windows --release

      # Ship the Visual C++ runtime next to the exe so it starts on PCs that do not have it installed.
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $out
          }

      - name: Zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../PodSync-windows-x64.zip
          $hash = (Get-FileHash ../PodSync-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  PodSync-windows-x64.zip" | Out-File ../PodSync-windows-x64.zip.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: PodSync-windows-x64
          path: |
            PodSync-windows-x64.zip
            PodSync-windows-x64.zip.sha256
